  .arrow:hover{border-color:#c9a84c;color:#c9a84c;background:#fffbf0}
  .team-card{max-width:860px;margin:0 auto;padding:0 16px 48px}
  .team-header{border-radius:16px 16px 0 0;padding:28px 32px 24px;display:flex;align-items:center;gap:20px;position:relative;overflow:hidden}
  .team-header::before{content:'';position:absolute;inset:0;opacity:.08;background:radial-gradient(ellipse at top right,#fff,transparent)}
  .team-logo{font-size:52px;line-height:1}
  .team-info{flex:1}
  .team-city{font-size:13px;letter-spacing:2px;text-transform:uppercase;opacity:.7;margin-bottom:4px}
  .team-name{font-size:30px;font-weight:800;letter-spacing:-0.5px}
  .team-conf{font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.5;margin-top:4px}
  .team-count{font-size:13px;opacity:.6;margin-left:auto;text-align:right}
  .roster-table{width:100%;border-collapse:collapse;background:#fff;border-radius:0 0 16px 16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
  .roster-table thead tr{background:#f0f0f5}
  .roster-table th{padding:11px 14px;text-align:left;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#999;font-weight:600;border-bottom:1px solid #e5e5ea}
  .roster-table th.num{text-align:center;width:40px}
  .roster-table th.stat{text-align:center}
  .roster-table td{padding:13px 14px;font-size:14px;border-bottom:1px solid #f0f0f5;vertical-align:middle}
  .roster-table tr:last-child td{border-bottom:none}
  .roster-table tr:hover td{background:#fafafa}
  .player-name{font-weight:600;color:#111}
  .player-pos{display:inline-block;font-size:10px;color:#888;background:#f0f0f5;border-radius:4px;padding:2px 6px;margin-left:8px;font-weight:500;letter-spacing:.5px}
  td.stat{text-align:center;font-size:13px;color:#444;font-variant-numeric:tabular-nums}
  td.salary{font-size:13px;color:#2a9d4e}
  td.years{text-align:center;font-size:13px}
  td.age{text-align:center;font-size:13px;color:#666}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#c9a84c;margin-right:3px;vertical-align:middle}
  .years-dots{display:flex;gap:3px;justify-content:center}
  .year-pip{width:8px;height:8px;border-radius:50%;background:#ddd}
  .year-pip.filled{background:#c9a84c}
  .pager{text-align:center;margin-top:14px;font-size:13px;color:#999;letter-spacing:.5px}
  .highlight{color:#c9a84c}
  @media(max-width:600px){
    .roster-table th,.roster-table td{padding:10px 8px;font-size:12px}
    .team-name{font-size:22px}
    .team-logo{font-size:36px}
  }

let idx = 0;

function render() {
  const t = teams[idx];
  document.getElementById('team-header').style.background =
    `linear-gradient(135deg, ${t.color}cc, ${t.color}66)`;
  document.getElementById('team-logo').textContent = t.emoji;
  document.getElementById('team-city').textContent = t.city;
  document.getElementById('team-name').textContent = t.name;
  document.getElementById('team-conf').textContent = t.conf;
  document.getElementById('team-count').innerHTML =
    `<div style="font-size:28px">${t.emoji}</div><div style="font-size:11px;margin-top:4px;letter-spacing:1px;color:#fff8">${t.roster.length} Players</div>`;
  document.getElementById('pager-text').innerHTML =
    `<span class="highlight">${idx+1}</span> / ${teams.length} &nbsp;·&nbsp; ${t.city} ${t.name}`;

  const tbody = document.getElementById('roster-body');
  tbody.innerHTML = '';
  t.roster.forEach(p => {
    const tr = document.createElement('tr');
    const yrsHtml = Array.from({length:Math.min(p.yrs,5)},(_,i)=>
      `<div class="year-pip filled"></div>`).join('') +
      Array.from({length:Math.max(0,5-p.yrs)},()=>
      `<div class="year-pip"></div>`).join('');
    tr.innerHTML = `
      <td class="player-name">${p.name}<span class="player-pos">${p.pos}</span></td>
      <td class="stat age">${p.age}</td>
      <td class="stat salary">${p.sal}</td>
      <td class="stat"><div class="years-dots">${yrsHtml}</div></td>
      <td class="stat">${p.pts.toFixed(1)}</td>
      <td class="stat">${p.reb.toFixed(1)}</td>
      <td class="stat">${p.ast.toFixed(1)}</td>
      <td class="stat">${p.stl.toFixed(1)}</td>
      <td class="stat">${p.blk.toFixed(1)}</td>
    `;
    tbody.appendChild(tr);
  });
}

document.getElementById('prev').addEventListener('click', () => {
  idx = (idx - 1 + teams.length) % teams.length;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
});
document.getElementById('next').addEventListener('click', () => {
  idx = (idx + 1) % teams.length;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') document.getElementById('prev').click();
  if (e.key === 'ArrowRight') document.getElementById('next').click();
});

render();
</script>
